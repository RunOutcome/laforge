#
# The container image, for linux/amd64 and linux/arm64. It is pushed to
# ghcr.io/runoutcome/laforge:<version> (and :latest for a full release) only
# when a person publishes a release. workflow_dispatch builds it without
# pushing.
name: image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: tags
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            v="${{ github.event.release.tag_name }}"; v="${v#v}"
            tags="ghcr.io/runoutcome/laforge:$v"
            [ "${{ github.event.release.prerelease }}" = true ] || tags="$tags,ghcr.io/runoutcome/laforge:latest"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            v="0.0.0-ci+${GITHUB_SHA::7}"; tags="laforge:ci"; echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.tags.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push == 'true' }}
          provenance: true
          sbom: true
